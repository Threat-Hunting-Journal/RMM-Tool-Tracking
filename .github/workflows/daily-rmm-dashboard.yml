name: Daily RMM Dashboard Update

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install feedparser pandas

      - name: Run RMM article search
        run: python scripts/rmm_article_search.py

      - name: Run RMM summary
        run: python scripts/rmm_summary.py

      - name: Copy dashboard data
        run: |
          cp tool_summary.csv docs/tool_summary.csv
          cp findings.csv docs/findings.csv

      - name: Commit updated files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add findings.csv tool_summary.csv docs/tool_summary.csv docs/findings.csv
          git diff --staged --quiet || git commit -m "Daily RMM dashboard update"
          git push
