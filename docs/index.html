<!DOCTYPE html>
<html>
<head>
    <title>RMM Threat Dashboard</title>
<script>
fetch('tool_summary.csv')
.then(response => response.text())
.then(data => {
    const rows = data.trim().split('\n');

    let html = '<table>';
    html += '<tr><th>Tool</th><th>Mentions</th></tr>';

    rows.slice(1).forEach(row => {
        const cols = row.split(',');

        html += `<tr>
                    <td>${cols[0]}</td>
                    <td>${cols[1]}</td>
                 </tr>`;
    });

    html += '</table>';

    document.getElementById('table').innerHTML = html;
    document.getElementById('findingCount').innerText = rows.length - 1;
});
</script>
    <style>
    body {
        background-color: #0d1117;
        color: #e6edf3;
        font-family: Segoe UI, Arial, sans-serif;
        margin: 30px;
}

    h1 {
        color: #58a6ff;
        font-size: 36px;
        margin-bottom: 5px;
}

    h2 {
        color: #7ee787;
}

    .subtitle {
        color: #8b949e;
        margin-bottom: 30px;
}

    table {
        border-collapse: collapse;
        width: 100%;
        background-color: #161b22;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0px 0px 15px rgba(88,166,255,.15);
}

    th {
        background-color: #1f6feb;
        color: white;
        padding: 12px;
        text-align: left;
}

    td {
        padding: 10px;
        border-bottom: 1px solid #30363d;
}

    tr:hover {
        background-color: #21262d;
}

    .card-container {
        display: flex;
        gap: 20px;
        margin-bottom: 30px;
}

    .card {
        background: #161b22;
        padding: 20px;
        border-radius: 10px;
        min-width: 200px;
        box-shadow: 0px 0px 15px rgba(88,166,255,.10);
}

    .card-title {
        color: #8b949e;
        font-size: 14px;
}

    .card-value {
        color: #58a6ff;
        font-size: 32px;
        font-weight: bold;
}
    </style>
</head>

<body>

<h1>RMM Threat Intelligence Dashboard</h1>

<p class="subtitle">
Tracking malicious use of Remote Monitoring & Management tools
</p>

<div class="card-container">

    <div class="card">
        <div class="card-title">Threat Sources</div>
        <div class="card-value">35+</div>
    </div>

    <div class="card">
        <div class="card-title">RMM Tools</div>
        <div class="card-value">221</div>
    </div>

    <div class="card">
        <div class="card-title">Findings</div>
        <div class="card-value" id="findingCount">--</div>
    </div>
</div>
    
<h2>Top RMM Tools</h2>
    <div id="table"></div>

    
<script>
fetch('tool_summary.csv')
.then(response => response.text())
.then(data => {

    const rows = data.trim().split('\n');

    let html = '<table>';
    html += '<tr><th>Tool</th><th>Mentions</th></tr>';

    rows.slice(1).forEach(row => {
        const cols = row.split(',');

        html += `<tr>
                    <td>${cols[0]}</td>
                    <td>${cols[1]}</td>
                 </tr>`;
    });

    html += '</table>';

    document.getElementById('table').innerHTML = html;
});
</script>

</body>
</html>
