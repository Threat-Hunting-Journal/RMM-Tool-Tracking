<!DOCTYPE html>
<html>
<head>
    <title>RMM Threat Dashboard</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background: #f5f5f5;
        }

        h1 {
            color: #003366;
        }

        table {
            border-collapse: collapse;
            width: 600px;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
        }

        th {
            background: #003366;
            color: white;
        }
    </style>
</head>

<body>

<h1>RMM Threat Dashboard</h1>

<p>Top RMM Tools Appearing in Threat Intelligence Reporting</p>

<div id="table"></div>

<script>
fetch('../tool_summary.csv')
.then(response => response.text())
.then(data => {

    const rows = data.trim().split('\n');

    let html = '<table>';
    html += '<tr><th>Tool</th><th>Mentions</th></tr>';

    rows.slice(1).forEach(row => {
        const cols = row.split(',');

        html += `<tr>
                    <td>${cols[0]}</td>
                    <td>${cols[1]}</td>
                 </tr>`;
    });

    html += '</table>';

    document.getElementById('table').innerHTML = html;
});
</script>

</body>
</html>
